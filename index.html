<script>
    // Expanded SIE Question Bank
    const sieQ = [
        { 
            q: "Which Treasury security is always issued at a discount?", 
            options: ["T-Bills", "T-Notes", "T-Bonds", "TIPS"], 
            correct: 0, 
            diff: "Easy",
            exp: "T-bills are sold at a discount and do not pay traditional interest. Their return is the difference between the discount price and par." 
        },
        { 
            q: "The maximum gain on a long call option is:", 
            options: ["Premium paid", "Strike price", "Unlimited", "Zero"], 
            correct: 2, 
            diff: "Medium",
            exp: "Long calls have unlimited potential as stock prices can theoretically rise to infinity." 
        },
        { 
            q: "Which body oversees securities markets in the US?", 
            options: ["SEC", "FINRA", "SIPC", "FDIC"], 
            correct: 0, 
            diff: "Easy",
            exp: "The SEC is the primary federal regulator of US securities markets." 
        },
        { 
            q: "What is the settlement time for a standard Corporate Bond trade?", 
            options: ["T+1", "T+2", "T+3", "Same Day"], 
            correct: 1, 
            diff: "Medium",
            exp: "Most corporate and municipal bonds settle on T+2 (two business days after the trade)." 
        },
        { 
            q: "A front-end load is associated with which class of mutual fund shares?", 
            options: ["Class A", "Class B", "Class C", "Class D"], 
            correct: 0, 
            diff: "Medium",
            exp: "Class A shares have a front-end sales charge (load) deducted from the initial investment." 
        },
        { 
            q: "A 'no-load' fund is prohibited from charging a 12b-1 fee that exceeds:", 
            options: ["0.25%", "0.50%", "0.75%", "1.00%"], 
            correct: 0, 
            diff: "Hard",
            exp: "To be marketed as a no-load fund, the 12b-1 fee cannot exceed 25 basis points (0.25%)." 
        },
        { 
            q: "Which of the following is NOT a characteristic of Preferred Stock?", 
            options: ["Fixed Dividend", "Voting Rights", "Priority over Common", "Equity Ownership"], 
            correct: 1, 
            diff: "Medium",
            exp: "Preferred stockholders generally do not have voting rights, unlike common stockholders." 
        },
        { 
            q: "The Cooling-Off period for a new issue typically lasts at least:", 
            options: ["10 Days", "20 Days", "30 Days", "90 Days"], 
            correct: 1, 
            diff: "Medium",
            exp: "The cooling-off period after filing a registration statement with the SEC typically lasts 20 calendar days." 
        },
        { 
            q: "Which risk cannot be eliminated through diversification?", 
            options: ["Business Risk", "Systematic Risk", "Credit Risk", "Liquidity Risk"], 
            correct: 1, 
            diff: "Hard",
            exp: "Systematic (Market) risk affects the entire market and cannot be diversified away." 
        },
        { 
            q: "A registered representative may share in a customer's account profits ONLY if:", 
            options: ["The customer is immediate family", "FINRA provides a waiver", "Permission is granted by the firm", "There is prior written consent and proportionate contribution"], 
            correct: 3, 
            diff: "Hard",
            exp: "Sharing in a customer's account requires firm approval, written client consent, and sharing must be proportionate to the rep's financial contribution." 
        }
    ];

    let idx = 0, scoreNum = 0, streakNum = 0;

    function render() {
        const box = document.getElementById('quiz-box');
        // Update the progress bar if it exists
        const bar = document.getElementById('bar');
        if(bar) bar.style.width = `${(idx / sieQ.length) * 100}%`;

        if(idx >= sieQ.length) {
            box.innerHTML = `
                <div class="text-center py-10">
                    <h3 class="text-6xl font-black text-pink mb-4">${Math.round((scoreNum/(sieQ.length * 100))*100)}%</h3>
                    <p class="text-gray-400 font-bold uppercase tracking-widest mb-8">Diagnostic Complete</p>
                    <div class="text-sm text-gray-500 mb-10">You correctly answered ${scoreNum/100} out of ${sieQ.length} questions.</div>
                    <button onclick="location.reload()" class="bg-pink text-black px-12 py-4 rounded-full font-bold uppercase text-xs tracking-widest hover:scale-105 transition">Restart Exam</button>
                </div>`;
            return;
        }
        
        const q = sieQ[idx];
        box.innerHTML = `
            <div class="flex justify-between mb-8 items-center">
                <span class="px-3 py-1 rounded bg-white/10 text-[10px] font-bold uppercase tracking-widest text-pink">${q.diff}</span>
                <span class="text-[10px] font-bold uppercase text-gray-500">Question ${idx+1}/${sieQ.length}</span>
            </div>
            <h3 class="text-2xl md:text-3xl font-bold mb-10 leading-tight">${q.q}</h3>
            <div id="options-container">
                ${q.options.map((o, i) => `<div class="option-card" onclick="check(${i})">${o}</div>`).join('')}
            </div>
        `;
    }

    function check(s) {
        const q = sieQ[idx];
        const correct = s === q.correct;
        if(correct) { 
            scoreNum += 100; 
            streakNum++; 
        } else { 
            streakNum = 0; 
        }
        
        document.getElementById('score').innerText = scoreNum;
        document.getElementById('streak').innerText = streakNum;
        
        document.getElementById('quiz-box').innerHTML = `
            <div class="bg-white p-10 rounded-3xl text-black shadow-2xl animate-in fade-in duration-500">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center ${correct ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                        <i class="fa-solid ${correct ? 'fa-check' : 'fa-xmark'}"></i>
                    </div>
                    <h4 class="text-2xl font-black uppercase italic" style="color:${correct ? '#22c55e' : '#ef4444'}">
                        ${correct ? 'Excellent' : 'Review Needed'}
                    </h4>
                </div>
                <p class="text-gray-600 mb-8 font-medium leading-relaxed">${q.exp}</p>
                <button onclick="idx++; render();" class="w-full bg-black text-white py-5 rounded-2xl font-bold uppercase tracking-widest hover:bg-zinc-800 transition">Next Question</button>
            </div>
        `;
    }
    render();
</script>
